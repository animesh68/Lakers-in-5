version: '3.8'

services:
  # ============================================================================
  # FastAPI Production Inference & Monitoring API
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lakers-in-5:latest
    container_name: lakers_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-lakers_in_5}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_TIMEOUT=${DB_TIMEOUT:-30}
      - PYTHONPATH=/app
    volumes:
      - monitoring_data:/app/data/monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Streamlit Production Monitoring Dashboard
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: lakers-in-5:latest
    container_name: lakers_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-lakers_in_5}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_TIMEOUT=${DB_TIMEOUT:-30}
      - PYTHONPATH=/app
    volumes:
      - monitoring_data:/app/data/monitoring
    depends_on:
      api:
        condition: service_healthy

volumes:
  monitoring_data:
    driver: local
